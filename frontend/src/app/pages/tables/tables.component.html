<h2>Tables</h2>

@if (error) {
  <div class="alert">{{ error }}</div>
}

@if (auth.isAdmin()) {
  <div class="card">
    <h3>{{ editingId ? 'Edit Table' : 'New Table' }}</h3>
    <form class="row" (ngSubmit)="save()">
      <label for="number">Number</label>
      <input id="number" name="number" type="number" min="1" [(ngModel)]="form.number" required>
      <label for="capacity">Capacity</label>
      <input id="capacity" name="capacity" type="number" min="1" [(ngModel)]="form.capacity" required>
      <button type="submit">{{ editingId ? 'Update' : 'Add' }}</button>
      @if (editingId) {
        <button type="button" class="secondary" (click)="reset()">Cancel</button>
      }
    </form>
  </div>
}

<div class="grid">
  @for (table of tables; track table.id) {
    <div class="card table-card" [class]="table.status.toLowerCase()">
      <h3>Table {{ table.number }}</h3>
      <p class="muted">{{ table.capacity }} seats</p>

      <select [ngModel]="table.status" (ngModelChange)="changeStatus(table, $event)">
        @for (status of statuses; track status) {
          <option [ngValue]="status">{{ status }}</option>
        }
      </select>

      @if (auth.isAdmin()) {
        <div class="actions">
          <button class="small" (click)="edit(table)">Edit</button>
          <button class="small danger" (click)="remove(table)">Delete</button>
        </div>
      }
    </div>
  } @empty {
    <p class="muted">No tables yet.</p>
  }
</div>
